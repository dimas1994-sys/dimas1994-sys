<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    <header>
        <div class="header-left">
            <h1><i class="fas fa-shield-alt"></i> Disaster Tracker</h1>
        </div>
        
        <div class="header-center">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search city or country..." />
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </div>
        
        <div class="header-right">
            <button id="logBtn" title="Disaster Log"><i class="fas fa-book"></i></button>
            <button id="notificationBtn" title="Notifications">
                <i class="fas fa-bell"></i>
                <span id="notifBadge" class="badge">0</span>
            </button>
            <button id="locationBtn" title="My Location"><i class="fas fa-location-crosshairs"></i></button>
            <div class="status-indicator">
                <span id="onlineStatus" class="status-dot online"></span>
                <span id="statusText">Online</span>
            </div>
            <button id="themeBtn" title="Toggle Theme"><i class="fas fa-moon"></i></button>
            <select id="languageSelect">
                <option value="en">🇺🇸 EN</option>
                <option value="ru">🇷🇺 RU</option>
                <option value="uk">🇺🇦 UK</option>
                <option value="es">🇪🇸 ES</option>
                <option value="fr">🇫🇷 FR</option>
                <option value="de">🇩🇪 DE</option>
                <option value="zh">🇨🇳 ZH</option>
            </select>
        </div>
    </header>

    <main>
        <aside class="filters-panel">
            <h3 data-translate="filters">Filters</h3>
            <div class="radius-control">
                <label data-translate="radius">Radius (km): <span id="radiusValue">500</span></label>
                <input type="range" id="radiusSlider" min="50" max="2000" step="50" value="500" />
            </div>
            <div class="filter-item">
                <input type="checkbox" id="earthquakeFilter" checked />
                <label for="earthquakeFilter"><i class="fas fa-house-crack"></i> <span data-translate="earthquake">Earthquake</span></label>
            </div>
            <div class="filter-item">
                <input type="checkbox" id="fireFilter" checked />
                <label for="fireFilter"><i class="fas fa-fire"></i> <span data-translate="fire">Fire</span></label>
            </div>
            <div class="filter-item">
                <input type="checkbox" id="volcanoFilter" checked />
                <label for="volcanoFilter"><i class="fas fa-mountain"></i> <span data-translate="volcano">Volcano</span></label>
            </div>
            <div class="filter-item">
                <input type="checkbox" id="landslideFilter" checked />
                <label for="landslideFilter"><i class="fas fa-hill-rockslide"></i> <span data-translate="landslide">Landslide</span></label>
            </div>
            <div class="filter-item">
                <input type="checkbox" id="floodFilter" checked />
                <label for="floodFilter"><i class="fas fa-water"></i> <span data-translate="flood">Flood</span></label>
            </div>
            <div class="filter-item">
                <input type="checkbox" id="hurricaneFilter" checked />
                <label for="hurricaneFilter"><i class="fas fa-wind"></i> <span data-translate="hurricane">Hurricane</span></label>
            </div>
            <div class="filter-item">
                <input type="checkbox" id="tornadoFilter" checked />
                <label for="tornadoFilter"><i class="fas fa-cloud-showers-heavy"></i> <span data-translate="tornado">Tornado</span></label>
            </div>
            <div class="filter-item">
                <input type="checkbox" id="typhoonFilter" checked />
                <label for="typhoonFilter"><i class="fas fa-wind"></i> <span data-translate="typhoon">Typhoon</span></label>
            </div>
            <div class="filter-item">
                <input type="checkbox" id="mudflowFilter" checked />
                <label for="mudflowFilter"><i class="fas fa-mound"></i> <span data-translate="mudflow">Mudflow</span></label>
            </div>
            <div class="filter-item">
                <input type="checkbox" id="radiationFilter" checked />
                <label for="radiationFilter"><i class="fas fa-radiation"></i> <span data-translate="radiation">Radiation</span></label>
            </div>
        </aside>

        <section class="main-content">
            <div class="stats-container">
                <div class="stat-card">
                    <i class="fas fa-users"></i>
                    <h4 data-translate="affected">Affected</h4>
                    <p id="affectedCount">0</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-skull"></i>
                    <h4 data-translate="deceased">Deceased</h4>
                    <p id="deceasedCount">0</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-person-digging"></i>
                    <h4 data-translate="missing">Missing</h4>
                    <p id="missingCount">0</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-triangle-exclamation"></i>
                    <h4 data-translate="disasters">Disasters</h4>
                    <p id="disastersCount">0</p>
                </div>
            </div>

            <div class="weather-widget">
                <div class="weather-main">
                    <i class="fas fa-cloud-sun" id="weatherIcon"></i>
                    <div class="weather-temp">
                        <span id="weatherTemp">--°C</span>
                        <span id="weatherDesc">--</span>
                    </div>
                </div>
                <div class="weather-details">
                    <span><i class="fas fa-droplet"></i> <span id="weatherHumidity">--%</span></span>
                    <span><i class="fas fa-wind"></i> <span id="weatherWind">-- km/h</span></span>
                </div>
            </div>

            <div id="map"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Disaster Tracker. All rights reserved.</p>
        <p>Data sources: USGS, NASA FIRMS, GDACS, OpenWeatherMap, NCEI</p>
    </footer>

    <script src="translations.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
