<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Tracker - Log</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        .log-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover {
            opacity: 0.9;
        }
        .log-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }
        .log-table th,
        .log-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .log-table th {
            background: var(--primary-color);
            color: white;
            font-weight: 600;
        }
        .log-table tr:hover {
            background: var(--hover-bg);
        }
        .severity-high { color: #e74c3c; font-weight: bold; }
        .severity-medium { color: #f39c12; font-weight: bold; }
        .severity-low { color: #27ae60; font-weight: bold; }
        
        body.dark-mode .log-table th { background: #2c3e50; }
        body.dark-mode .log-table { background: #1a1a2e; }
        body.dark-mode .log-table td { border-color: #2c3e50; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1><i class="fas fa-shield-alt"></i> Disaster Tracker - Log</h1>
        </div>
        <div class="header-right">
            <button id="themeBtn" title="Toggle Theme"><i class="fas fa-moon"></i></button>
            <select id="languageSelect">
                <option value="en">🇺🇸 EN</option>
                <option value="ru">🇷🇺 RU</option>
                <option value="uk">🇺🇦 UK</option>
                <option value="es">🇪🇸 ES</option>
                <option value="fr">🇫🇷 FR</option>
                <option value="de">🇩🇪 DE</option>
                <option value="zh">🇨🇳 ZH</option>
            </select>
        </div>
    </header>

    <main>
        <div class="log-container">
            <div class="log-header">
                <h2 data-translate="disasterLog">Disaster Log</h2>
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> <span data-translate="backToMain">Back to Main</span></a>
            </div>
            <table class="log-table">
                <thead>
                    <tr>
                        <th data-translate="date">Date</th>
                        <th data-translate="type">Type</th>
                        <th data-translate="location">Location</th>
                        <th data-translate="magnitude">Magnitude</th>
                        <th data-translate="casualties">Casualties</th>
                        <th data-translate="severity">Severity</th>
                    </tr>
                </thead>
                <tbody id="logBody">
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Disaster Tracker. All rights reserved.</p>
        <p>Data sources: USGS, NASA FIRMS, GDACS, OpenWeatherMap, NCEI</p>
    </footer>

    <script src="translations.js"></script>
    <script>
        // Load disasters from localStorage
        const disasters = JSON.parse(localStorage.getItem('disasters') || '[]');
        const logBody = document.getElementById('logBody');
        
        disasters.forEach(disaster => {
            const row = document.createElement('tr');
            const severityClass = disaster.severity === 'high' ? 'severity-high' : 
                                 disaster.severity === 'medium' ? 'severity-medium' : 'severity-low';
            
            row.innerHTML = `
                <td>${new Date(disaster.time).toLocaleString()}</td>
                <td><i class="fas ${disaster.icon}"></i> ${disaster.type}</td>
                <td>${disaster.location}</td>
                <td>${disaster.magnitude || 'N/A'}</td>
                <td>${disaster.casualties || 'N/A'}</td>
                <td class="${severityClass}">${disaster.severity}</td>
            `;
            logBody.appendChild(row);
        });

        // Theme toggle
        const themeBtn = document.getElementById('themeBtn');
        const isDark = localStorage.getItem('darkMode') === 'true';
        if (isDark) document.body.classList.add('dark-mode');
        
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        });

        // Language
        const langSelect = document.getElementById('languageSelect');
        langSelect.value = localStorage.getItem('language') || 'en';
        
        function applyTranslations() {
            const lang = langSelect.value;
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }
        
        langSelect.addEventListener('change', () => {
            localStorage.setItem('language', langSelect.value);
            applyTranslations();
        });
        
        applyTranslations();
    </script>
</body>
</html>
